name: gz-buy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-example_dev}
      POSTGRES_USER: ${POSTGRES_USER:-example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://example:example_dev_password@db:5432/example_dev?schema=public}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: gz-buy-api:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      TRUST_PROXY: "1"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:3002}
      BANK_TRANSFER_QR_URL: ${BANK_TRANSFER_QR_URL:-}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in .env}
      PASSWORD_HASH_ROUNDS: ${PASSWORD_HASH_ROUNDS:-12}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      ORDER_PAYMENT_TIMEOUT_MINUTES: ${ORDER_PAYMENT_TIMEOUT_MINUTES:-1440}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://example:example_dev_password@db:5432/example_dev?schema=public}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - payment_proofs:/app/uploads/payment-proofs
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-3002}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/api/v1/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: express-api_postgres_data
    external: true
  payment_proofs:
    name: express-api_payment_proofs
